<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com/cast/sdk/libs/; style-src 'self'; font-src 'self'; img-src 'self' https:; media-src 'self' https: blob:; connect-src 'self' https:; base-uri 'none'; object-src 'none'; form-action 'none'">
  <link rel="icon" href="assets/patina.png">
  <link rel="preload" href="assets/noto-sans-latin-wght-normal.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="receiver.css">
  <title>Patina Player</title>
  <script type="module" src="receiver.js"></script>
</head>
<body>
  <audio id="audio"></audio>
  <main>
    <div id="idle"><img src="assets/patina-logo.webp" alt="Patina Player"></div>
    <div id="tracks"></div>
  </main>
  <template id="track">
    <section class="scene" aria-label="Now playing">
      <canvas class="backdrop" width="256" height="256" aria-hidden="true"></canvas>
      <div class="veil" aria-hidden="true"></div>
      <div class="layout">
        <div class="sleeve">
          <svg class="disc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/></svg>
        </div>
        <div class="info">
          <header>
            <h1 class="title clamp" dir="auto"></h1>
            <p class="byline clamp" dir="auto"><strong class="artist"></strong><span class="album"></span></p>
            <div class="playback-facts">
              <span class="quality" hidden></span>
              <span class="state"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V5h18v14h-6M3 12a8 8 0 0 1 8 8M3 16a4 4 0 0 1 4 4M3 20h.01"/></svg><span class="status"></span></span>
            </div>
          </header>
          <div class="lyrics" role="region" aria-label="Synced lyrics" hidden>
            <p class="lyric-heading"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="15" cy="8" r="5"/><path d="m10 9-7 9 3 3 9-8m-8 1 3 3"/></svg>Synced lyrics</p>
            <div class="lines"></div>
            <p class="cue-count"></p>
          </div>
          <div class="progress">
            <div class="waveform" hidden aria-hidden="true">
              <div class="waveform-bars rest"></div>
              <div class="waveform-bars played"></div>
            </div>
            <div class="rail"><div class="played"></div></div>
            <div class="times"><span class="position"></span><span class="duration"></span></div>
          </div>
          <div class="next" hidden>
            <div class="thumb" hidden></div>
            <div class="queue-text"><p class="caption">Next up</p><p class="next-title clamp" dir="auto"></p></div>
            <span class="next-time"></span>
          </div>
        </div>
      </div>
    </section>
  </template>
</body>
</html>
